<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yahtzee — Casino Night</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: radial-gradient(ellipse at center, #1a4a2e 0%, #0a1f12 100%);
  min-height: 100vh;
  font-family: 'Georgia', serif;
  color: #e8d5a3;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
}

h1 {
  font-size: 2.6rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #f0c040;
  text-shadow: 0 0 24px rgba(240,192,64,0.5), 2px 2px 6px rgba(0,0,0,0.9);
  margin-bottom: 2px;
  margin-top: 8px;
}

.subtitle {
  font-size: 0.78rem;
  letter-spacing: 0.4em;
  color: #6a9a76;
  margin-bottom: 24px;
  text-transform: uppercase;
}

.game-container {
  display: flex;
  gap: 20px;
  width: 100%;
  max-width: 880px;
  align-items: flex-start;
}

/* ── Left panel ── */
.left-panel {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 380px;
}

.dice-area {
  background: #0f3520;
  border: 2px solid #2d6e40;
  border-radius: 16px;
  padding: 24px 20px;
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.6), 0 4px 14px rgba(0,0,0,0.5);
  width: 100%;
}

.dice-row {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.die {
  width: 66px;
  height: 66px;
  background: #f5f0e8;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 2px 4px 8px rgba(0,0,0,0.55), inset 0 1px 2px rgba(255,255,255,0.9);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  user-select: none;
  border: 3px solid transparent;
}

.die:hover:not(.rolling):not(.unclickable) {
  transform: translateY(-4px);
  box-shadow: 2px 8px 14px rgba(0,0,0,0.55), inset 0 1px 2px rgba(255,255,255,0.9);
}

.die.locked {
  background: #fffce8;
  border-color: #f0c040;
  transform: translateY(-5px);
  box-shadow: 0 0 12px rgba(240,192,64,0.4), 2px 8px 12px rgba(0,0,0,0.5),
              inset 0 1px 2px rgba(255,255,255,0.9);
}

.die.unclickable {
  cursor: default;
}

@keyframes rollShake {
  0%   { transform: rotate(0deg)   translateY(0) scale(1); }
  12%  { transform: rotate(-18deg) translateY(-3px) scale(1.07); }
  28%  { transform: rotate(22deg)  translateY(2px) scale(0.93); }
  44%  { transform: rotate(-12deg) translateY(-2px) scale(1.05); }
  60%  { transform: rotate(16deg)  translateY(1px) scale(0.96); }
  76%  { transform: rotate(-6deg)  translateY(-1px) scale(1.02); }
  90%  { transform: rotate(4deg)   translateY(0) scale(0.99); }
  100% { transform: rotate(0deg)   translateY(0) scale(1); }
}

.die.rolling {
  animation: rollShake 0.62s ease-out;
  cursor: default;
}

.die svg {
  width: 100%;
  height: 100%;
  padding: 5px;
}

.lock-badge {
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  background: #f0c040;
  color: #1a0c00;
  font-size: 8px;
  font-weight: bold;
  padding: 1px 5px;
  border-radius: 4px;
  letter-spacing: 0.08em;
  white-space: nowrap;
  display: none;
  font-family: sans-serif;
}

.die.locked .lock-badge { display: block; }

/* ── Controls ── */
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.roll-status {
  font-size: 0.85rem;
  color: #8fb89a;
  letter-spacing: 0.08em;
  min-height: 1.2em;
  text-align: center;
}

.btn {
  padding: 12px 28px;
  font-size: 1rem;
  font-family: 'Georgia', serif;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  font-weight: bold;
  width: 200px;
}

.btn-roll {
  background: linear-gradient(180deg, #f5c842 0%, #d4a017 100%);
  color: #1a0c00;
  box-shadow: 0 4px 0 #8a6500, 0 6px 14px rgba(0,0,0,0.45);
}
.btn-roll:hover:not(:disabled) {
  background: linear-gradient(180deg, #ffd84a 0%, #e0b020 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #8a6500, 0 10px 18px rgba(0,0,0,0.45);
}
.btn-roll:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #8a6500, 0 3px 8px rgba(0,0,0,0.45);
}
.btn-roll:disabled {
  background: linear-gradient(180deg, #444 0%, #2a2a2a 100%);
  color: #555;
  box-shadow: 0 2px 0 #111;
  cursor: not-allowed;
}

.btn-new {
  background: linear-gradient(180deg, #2d8a50 0%, #1d6035 100%);
  color: #e8d5a3;
  box-shadow: 0 3px 0 #0d3018, 0 5px 12px rgba(0,0,0,0.45);
  font-size: 0.85rem;
}
.btn-new:hover {
  background: linear-gradient(180deg, #38a060 0%, #256840 100%);
  transform: translateY(-1px);
  box-shadow: 0 4px 0 #0d3018, 0 7px 14px rgba(0,0,0,0.45);
}
.btn-new:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 #0d3018;
}

/* ── Game-over panel ── */
.game-over-panel {
  display: none;
  background: linear-gradient(160deg, #0d2218 0%, #0a1a10 100%);
  border: 2px solid #f0c040;
  border-radius: 16px;
  padding: 28px 24px;
  text-align: center;
  width: 100%;
  box-shadow: 0 0 40px rgba(240,192,64,0.2);
}
.game-over-panel.visible { display: block; }

.game-over-title {
  font-size: 1.5rem;
  color: #f0c040;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.final-score {
  font-size: 3.2rem;
  color: #fff;
  font-weight: bold;
  line-height: 1;
  margin: 10px 0 6px;
  text-shadow: 0 0 20px rgba(255,255,255,0.3);
}
.score-rating {
  font-size: 0.9rem;
  color: #8fb89a;
  margin-bottom: 18px;
  font-style: italic;
}

/* ── Scorecard ── */
.scorecard {
  flex: 1;
  background: #0f2a1a;
  border: 2px solid #2d6e40;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(0,0,0,0.55);
  min-width: 0;
}

.scorecard-header {
  background: linear-gradient(180deg, #1e5a32 0%, #143d22 100%);
  padding: 10px 16px;
  font-size: 0.7rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #f0c040;
  border-bottom: 1px solid #2d6e40;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.section-header {
  background: #143d22;
  padding: 5px 14px;
  font-size: 0.65rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #6a9a76;
  border-bottom: 1px solid #1a4a2a;
}

.score-row {
  display: flex;
  align-items: center;
  padding: 6px 14px;
  border-bottom: 1px solid #1a4a2a;
  cursor: pointer;
  transition: background 0.1s;
  min-height: 34px;
}
.score-row:hover:not(.no-hover) { background: #1a4a2a; }
.score-row.no-hover             { cursor: default; }
.score-row.scored               { cursor: default; }
.score-row.meta                 { background: #0d2218; cursor: default; }
.score-row.total-row            { border-top: 2px solid #2d6e40; background: #0d2218; cursor: default; }

.score-label {
  flex: 1;
  font-size: 0.8rem;
  color: #c8c0a8;
}
.score-value {
  font-size: 0.88rem;
  font-weight: bold;
  min-width: 38px;
  text-align: right;
  color: #e8d5a3;
}
.score-value.preview      { color: #5a9a6a; font-style: italic; font-weight: normal; }
.score-value.zero-preview { color: #7a5050; font-style: italic; font-weight: normal; }
.score-value.locked-val   { color: #f0c040; }
.score-value.bonus-val    { color: #6ab87a; }
.score-value.total-val    { color: #f0c040; font-size: 1rem; }
.score-value.dash         { color: #3a6a4a; }

.bonus-progress {
  font-size: 0.7rem;
  color: #6a9a76;
  margin-left: 6px;
}

.yahtzee-bonus-row {
  display: flex;
  align-items: center;
  padding: 5px 14px;
  background: #0d2218;
  border-bottom: 1px solid #1a4a2a;
  gap: 8px;
}
.bonus-dots {
  display: flex;
  gap: 5px;
}
.bonus-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 1px solid #2d6e40;
  background: #0d2218;
  transition: background 0.3s, box-shadow 0.3s;
}
.bonus-dot.earned {
  background: #f0c040;
  border-color: #f0c040;
  box-shadow: 0 0 8px rgba(240,192,64,0.7);
}
</style>
</head>
<body>

<h1>Yahtzee</h1>
<p class="subtitle">Casino Night Edition</p>

<div class="game-container">

  <!-- Left: Dice + Controls -->
  <div class="left-panel">
    <div class="dice-area">
      <div class="dice-row" id="diceRow"></div>
    </div>

    <div class="controls">
      <div class="roll-status" id="rollStatus">Press Roll to begin your turn</div>
      <button class="btn btn-roll" id="rollBtn">Roll Dice</button>
      <button class="btn btn-new"  id="newGameBtn">New Game</button>
    </div>

    <div class="game-over-panel" id="gameOverPanel">
      <div class="game-over-title">Game Over!</div>
      <div class="final-score"   id="finalScore">0</div>
      <div class="score-rating"  id="scoreRating"></div>
      <button class="btn btn-new" id="playAgainBtn" style="width:180px;margin:0 auto;">Play Again</button>
    </div>
  </div>

  <!-- Right: Scorecard -->
  <div class="scorecard" id="scorecard"></div>

</div>

<script>
'use strict';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// AUDIO
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let _audioCtx = null;
function ctx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function tone(freq, type, t0, dur, vol) {
  const ac = ctx();
  const osc  = ac.createOscillator();
  const gain = ac.createGain();
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

function noise(t0, dur, vol, centerFreq) {
  const ac   = ctx();
  const rate = ac.sampleRate;
  const buf  = ac.createBuffer(1, Math.ceil(rate * dur), rate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src    = ac.createBufferSource();
  const filter = ac.createBiquadFilter();
  const gain   = ac.createGain();
  src.buffer = buf;
  filter.type = 'bandpass';
  filter.frequency.value = centerFreq || 700;
  filter.Q.value = 0.6;
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter);
  filter.connect(gain);
  gain.connect(ac.destination);
  src.start(t0);
  src.stop(t0 + dur);
}

const sfx = {
  roll() {
    const t = ctx().currentTime;
    for (let i = 0; i < 6; i++) {
      noise(t + i * 0.065, 0.09, 0.35, 500 + Math.random() * 600);
      tone(70 + Math.random() * 50, 'square', t + i * 0.065, 0.05, 0.12);
    }
  },
  lock() {
    const t = ctx().currentTime;
    tone(130, 'sine', t,        0.07, 0.45);
    tone(95,  'sine', t + 0.05, 0.10, 0.30);
  },
  unlock() {
    const t = ctx().currentTime;
    tone(95,  'sine', t,        0.05, 0.30);
    tone(150, 'sine', t + 0.04, 0.07, 0.20);
  },
  score() {
    const t = ctx().currentTime;
    tone(528, 'sine', t,        0.25, 0.30);
    tone(660, 'sine', t + 0.12, 0.18, 0.20);
  },
  yahtzee() {
    const t = ctx().currentTime;
    [392, 494, 587, 698, 784, 880].forEach((f, i) => {
      tone(f,     'triangle', t + i * 0.09, 0.22, 0.35);
    });
    [523, 659, 784].forEach((f, i) => {
      tone(f, 'sine', t + 0.55 + i * 0.06, 0.40, 0.20);
    });
  },
  bonusYahtzee() {
    const t = ctx().currentTime;
    [523, 659, 784, 1047, 1319].forEach((f, i) => {
      tone(f,       'triangle', t + i * 0.08, 0.24, 0.38);
      tone(f * 1.5, 'sine',     t + i * 0.08 + 0.04, 0.18, 0.18);
    });
    [784, 988, 1175, 1568].forEach((f, i) => {
      tone(f, 'sine', t + 0.5 + i * 0.10, 0.50, 0.22);
    });
  },
  gameOver() {
    const t = ctx().currentTime;
    [523, 494, 440, 392, 330].forEach((f, i) => {
      tone(f, 'sine', t + i * 0.28, 0.32, 0.28);
    });
  },
  newGame() {
    const t = ctx().currentTime;
    [330, 440, 554].forEach((f, i) => {
      tone(f, 'triangle', t + i * 0.11, 0.16, 0.28);
    });
  },
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CATEGORIES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const UPPER = [
  { id: 'ones',   label: 'Ones'   },
  { id: 'twos',   label: 'Twos'   },
  { id: 'threes', label: 'Threes' },
  { id: 'fours',  label: 'Fours'  },
  { id: 'fives',  label: 'Fives'  },
  { id: 'sixes',  label: 'Sixes'  },
];
const LOWER = [
  { id: 'threeOfAKind',  label: 'Three of a Kind' },
  { id: 'fourOfAKind',   label: 'Four of a Kind'  },
  { id: 'fullHouse',     label: 'Full House'       },
  { id: 'smallStraight', label: 'Sm. Straight'     },
  { id: 'largeStraight', label: 'Lg. Straight'     },
  { id: 'yahtzee',       label: 'Yahtzee'          },
  { id: 'chance',        label: 'Chance'           },
];
const ALL_CATS = [...UPPER, ...LOWER];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let state = {};

function initState() {
  state = {
    dice:          [1, 2, 3, 4, 5],
    locked:        [false, false, false, false, false],
    rollsLeft:     3,
    hasRolled:     false,
    turn:          0,       // 0–12
    scores:        {},      // id -> number | null
    yahtzeeBonus:  0,
    gameOver:      false,
  };
  ALL_CATS.forEach(c => { state.scores[c.id] = null; });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCORING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function sum(dice)  { return dice.reduce((a, b) => a + b, 0); }
function tally(dice) {
  const c = {};
  dice.forEach(d => { c[d] = (c[d] || 0) + 1; });
  return c;
}

function calcScore(id, dice) {
  const c   = tally(dice);
  const vs  = Object.values(c);
  const s   = sum(dice);
  const isY = vs.some(v => v === 5);
  // Yahtzee joker: if Yahtzee box is already scored 50, acts as wild for lower section
  const joker = isY && state.scores['yahtzee'] === 50;

  switch (id) {
    case 'ones':          return dice.filter(d => d === 1).reduce((a) => a + 1, 0);
    case 'twos':          return dice.filter(d => d === 2).length * 2;
    case 'threes':        return dice.filter(d => d === 3).length * 3;
    case 'fours':         return dice.filter(d => d === 4).length * 4;
    case 'fives':         return dice.filter(d => d === 5).length * 5;
    case 'sixes':         return dice.filter(d => d === 6).length * 6;
    case 'threeOfAKind':  return vs.some(v => v >= 3) ? s : 0;
    case 'fourOfAKind':   return vs.some(v => v >= 4) ? s : 0;
    case 'fullHouse':
      if (joker) return 25;
      return (vs.includes(3) && vs.includes(2)) ? 25 : 0;
    case 'smallStraight': {
      if (joker) return 30;
      const u = [...new Set(dice)].sort((a, b) => a - b).join('');
      return ['1234', '2345', '3456'].some(p => u.includes(p)) ? 30 : 0;
    }
    case 'largeStraight': {
      if (joker) return 40;
      const u = [...new Set(dice)].sort((a, b) => a - b).join('');
      return (u === '12345' || u === '23456') ? 40 : 0;
    }
    case 'yahtzee': return isY ? 50 : 0;
    case 'chance':  return s;
    default:        return 0;
  }
}

function upperRaw()  { return UPPER.reduce((t, c) => t + (state.scores[c.id] || 0), 0); }
function upperBonus(){ return upperRaw() >= 63 ? 35 : 0; }
function upperTotal(){ return upperRaw() + upperBonus(); }
function lowerTotal(){
  return LOWER.reduce((t, c) => t + (state.scores[c.id] || 0), 0)
       + state.yahtzeeBonus * 100;
}
function grandTotal(){ return upperTotal() + lowerTotal(); }

function isYahtzeeRoll(dice) { return Object.values(tally(dice)).some(v => v === 5); }

function rating(score) {
  if (score >= 400) return 'Legendary — incredible play!';
  if (score >= 350) return 'Outstanding performance!';
  if (score >= 300) return 'Excellent score!';
  if (score >= 250) return 'Great game!';
  if (score >= 200) return 'Solid effort!';
  if (score >= 150) return 'Not bad — keep practicing.';
  return 'Better luck next time!';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SVG PIP DICE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const PIPS = {
  1: [[35, 35]],
  2: [[22, 22], [48, 48]],
  3: [[22, 22], [35, 35], [48, 48]],
  4: [[22, 22], [48, 22], [22, 48], [48, 48]],
  5: [[22, 22], [48, 22], [35, 35], [22, 48], [48, 48]],
  6: [[22, 19], [48, 19], [22, 35], [48, 35], [22, 51], [48, 51]],
};

function dieSVG(v) {
  const circles = (PIPS[v] || [])
    .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5.5" fill="#1a2a1a"/>`)
    .join('');
  return `<svg viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">${circles}</svg>`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderDice() {
  const row = document.getElementById('diceRow');
  row.innerHTML = '';
  const canLock = state.hasRolled && state.rollsLeft > 0 && !state.gameOver;

  state.dice.forEach((val, i) => {
    const div = document.createElement('div');
    div.className = 'die' + (state.locked[i] ? ' locked' : '') + (!canLock ? ' unclickable' : '');
    div.innerHTML = dieSVG(val) + '<span class="lock-badge">HELD</span>';
    if (canLock) div.addEventListener('click', () => toggleLock(i));
    row.appendChild(div);
  });
}

function renderScorecard() {
  const card        = document.getElementById('scorecard');
  const showPreview = state.hasRolled && !state.gameOver;
  const uRaw        = upperRaw();
  const uBns        = upperBonus();

  function rowHTML(cat) {
    const scored  = state.scores[cat.id] !== null;
    const preview = (!scored && showPreview) ? calcScore(cat.id, state.dice) : null;
    const clickable = !scored && !state.gameOver && state.hasRolled;

    let valEl;
    if (scored) {
      valEl = `<span class="score-value locked-val">${state.scores[cat.id]}</span>`;
    } else if (preview !== null) {
      const cls = preview > 0 ? 'preview' : 'zero-preview';
      valEl = `<span class="score-value ${cls}">${preview}</span>`;
    } else {
      valEl = `<span class="score-value dash">—</span>`;
    }

    const cls = ['score-row', scored ? 'scored no-hover' : '', !clickable ? 'no-hover' : '']
      .filter(Boolean).join(' ');

    return `<div class="${cls}" data-cat="${clickable ? cat.id : ''}">${
      `<span class="score-label">${cat.label}</span>${valEl}`
    }</div>`;
  }

  card.innerHTML = `
    <div class="scorecard-header">
      <span>Scorecard</span>
      <span>Turn ${Math.min(state.turn + 1, 13)} / 13</span>
    </div>

    <div class="section-header">Upper Section</div>
    ${UPPER.map(rowHTML).join('')}
    <div class="score-row meta">
      <span class="score-label">Bonus (≥63 → +35)
        <span class="bonus-progress">${Math.min(uRaw, 63)} / 63</span>
      </span>
      <span class="score-value ${uBns ? 'bonus-val' : 'dash'}">${uBns || '—'}</span>
    </div>
    <div class="score-row total-row">
      <span class="score-label">Upper Total</span>
      <span class="score-value total-val">${upperTotal()}</span>
    </div>

    <div class="section-header">Lower Section</div>
    ${LOWER.map(rowHTML).join('')}
    <div class="yahtzee-bonus-row">
      <span class="score-label" style="font-size:0.76rem">Yahtzee Bonuses (+100 each)</span>
      <div class="bonus-dots">
        ${[0,1,2].map(i =>
          `<div class="bonus-dot${state.yahtzeeBonus > i ? ' earned' : ''}"></div>`
        ).join('')}
      </div>
    </div>
    <div class="score-row total-row">
      <span class="score-label">Grand Total</span>
      <span class="score-value total-val">${grandTotal()}</span>
    </div>
  `;

  // Bind click handlers
  card.querySelectorAll('[data-cat]').forEach(el => {
    const id = el.getAttribute('data-cat');
    if (id) el.addEventListener('click', () => scoreCategory(id));
  });
}

function renderControls() {
  const statusEl = document.getElementById('rollStatus');
  const rollBtn  = document.getElementById('rollBtn');

  if (state.gameOver) {
    statusEl.textContent = 'Game complete!';
    rollBtn.disabled = true;
    return;
  }
  if (!state.hasRolled) {
    statusEl.textContent = 'Press Roll to begin your turn';
    rollBtn.disabled = false;
  } else if (state.rollsLeft === 0) {
    statusEl.textContent = 'Select a scoring category';
    rollBtn.disabled = true;
  } else {
    const held = state.locked.filter(Boolean).length;
    statusEl.textContent = `Roll ${4 - state.rollsLeft} of 3  •  ${held} held`;
    rollBtn.disabled = false;
  }
}

function render() {
  renderDice();
  renderScorecard();
  renderControls();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ACTIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function rollDice() {
  if (state.rollsLeft <= 0 || state.gameOver) return;

  sfx.roll();

  // Animate unlocked dice immediately
  document.querySelectorAll('.die').forEach((el, i) => {
    if (!state.locked[i]) el.classList.add('rolling');
  });

  setTimeout(() => {
    // Randomise unlocked dice
    state.dice = state.dice.map((v, i) =>
      state.locked[i] ? v : Math.floor(Math.random() * 6) + 1
    );
    state.rollsLeft--;
    state.hasRolled = true;

    render();

    // Post-roll: check for Yahtzee fanfare
    if (isYahtzeeRoll(state.dice)) {
      if (state.scores['yahtzee'] === 50) {
        setTimeout(() => sfx.bonusYahtzee(), 80);
      } else if (state.scores['yahtzee'] === null) {
        setTimeout(() => sfx.yahtzee(), 80);
      }
    }
  }, 620);
}

function toggleLock(index) {
  if (!state.hasRolled || state.rollsLeft <= 0 || state.gameOver) return;
  state.locked[index] = !state.locked[index];
  state.locked[index] ? sfx.lock() : sfx.unlock();
  render();
}

function scoreCategory(id) {
  if (!state.hasRolled || state.scores[id] !== null || state.gameOver) return;

  const pts = calcScore(id, state.dice);
  state.scores[id] = pts;

  // Yahtzee bonus
  if (isYahtzeeRoll(state.dice) && state.scores['yahtzee'] === 50 && id !== 'yahtzee') {
    state.yahtzeeBonus++;
    setTimeout(() => sfx.bonusYahtzee(), 60);
  } else {
    sfx.score();
  }

  state.turn++;

  if (state.turn >= 13) {
    state.gameOver = true;
    render();
    showGameOver();
    return;
  }

  // Next turn
  state.dice    = [1, 2, 3, 4, 5];
  state.locked  = [false, false, false, false, false];
  state.rollsLeft = 3;
  state.hasRolled = false;
  render();
}

function showGameOver() {
  const total = grandTotal();
  document.getElementById('finalScore').textContent = total;
  document.getElementById('scoreRating').textContent = rating(total);
  document.getElementById('gameOverPanel').classList.add('visible');
  setTimeout(() => sfx.gameOver(), 400);
}

function newGame() {
  sfx.newGame();
  document.getElementById('gameOverPanel').classList.remove('visible');
  initState();
  render();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// EVENTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.getElementById('rollBtn').addEventListener('click', rollDice);
document.getElementById('newGameBtn').addEventListener('click', newGame);
document.getElementById('playAgainBtn').addEventListener('click', newGame);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
initState();
render();
</script>
</body>
</html>
